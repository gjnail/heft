name: Release

# Pushing a tag such as v0.1.0 builds the Windows, macOS and Linux downloads
# and opens a draft GitHub release with them. Running the workflow by hand
# (Actions > Release > Run workflow) builds the downloads without a release.
# See docs/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi

      # The release notes are the CHANGELOG.md section for this version.
      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md

      # The licenses of every Rust library Heft uses, for all three
      # downloads. Fails if a dependency's license isn't accepted in
      # about.toml.
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Third-party licenses
        run: cargo about generate --locked about.hbs -o THIRD-PARTY-LICENSES.txt

      - uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES.txt

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read # lets SignPath fetch the unsigned exe
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release --locked

      # build.rs only warns when it can't embed the icon, and .cargo/config.toml
      # links the C runtime statically. Make sure both happened.
      - name: Check the exe
        shell: bash
        run: |
          exe=target/release/heft.exe
          product=$(powershell -NoProfile -Command "(Get-Item $exe).VersionInfo.ProductVersion" | tr -d '\r')
          if [ "$product" != "$VERSION" ]; then
            echo "::error::heft.exe has product version '$product', expected $VERSION"
            exit 1
          fi
          if grep -qai 'vcruntime140' "$exe"; then
            echo "::error::heft.exe needs the Visual C++ runtime DLL"
            exit 1
          fi

      - name: Smoke test
        shell: bash
        run: |
          target/release/heft.exe --bench . --out bench.txt
          cat bench.txt
          grep -q "^files" bench.txt

      # Code signing through SignPath Foundation. It's skipped until the
      # repository variable SIGNPATH_ORGANIZATION_ID and the secret
      # SIGNPATH_API_TOKEN are set. Tags use the release certificate, and each
      # request waits for approval in SignPath; runs started by hand use the
      # test certificate. See docs/releasing.md.
      - name: Upload unsigned exe
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          path: target/release/heft.exe
          archive: false

      - name: Sign
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'heft' }}
          signing-policy-slug: ${{ github.ref_type == 'tag' && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(env.VERSION) }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: target/signed
          skip-decompress: true

      - name: Use the signed exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature target/signed/heft.exe
          "Signature: $($sig.Status), $($sig.SignerCertificate.Subject)"
          # The test certificate isn't trusted, so only release signatures must be valid.
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $sig.Status -ne 'Valid') {
            throw "heft.exe signature is $($sig.Status): $($sig.StatusMessage)"
          }
          Copy-Item target/signed/heft.exe target/release/heft.exe -Force

      - uses: actions/download-artifact@v8
        with:
          name: third-party-licenses

      # heft.exe embeds the PawnIO modules, so their LGPL text ships too.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item assets/pawnio/COPYING PAWNIO-LICENSE.txt
          Compress-Archive -Path target/release/heft.exe, LICENSE, THIRD-PARTY-LICENSES.txt, PAWNIO-LICENSE.txt -DestinationPath "dist/heft-$env:VERSION-windows-x86_64.zip"

      - name: winget manifests
        shell: bash
        run: bash scripts/winget-manifests.sh "$VERSION" "dist/heft-$VERSION-windows-x86_64.zip" winget

      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: winget-manifests
          path: winget/*

  macos:
    name: macOS
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HEFT_BUNDLE_ID: io.github.gjnail.heft
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # bundle-macos.sh copies the licenses into the app before signing it.
      - uses: actions/download-artifact@v8
        with:
          name: third-party-licenses

      # Developer ID signing and notarization. Both are skipped, and the app
      # is signed ad hoc, until the repository variable APPLE_TEAM_ID is set
      # along with the secrets and variables below. See docs/releasing.md.
      - name: Import the signing certificate
        if: vars.APPLE_TEAM_ID != ''
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n "s/.*\"\(Developer ID Application: .* ($TEAM_ID)\)\"/\1/p" | head -1)
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE has no Developer ID Application certificate for team $TEAM_ID"
            exit 1
          fi
          echo "HEFT_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - run: bash scripts/bundle-macos.sh

      - name: Smoke test
        run: |
          target/Heft.app/Contents/MacOS/heft --bench . --out bench.txt
          cat bench.txt
          grep -q "^files" bench.txt

      # Apple checks the app for malware and issues a ticket, which is then
      # stapled to the app so Gatekeeper accepts it without going online.
      - name: Notarize
        if: vars.APPLE_TEAM_ID != ''
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$API_KEY" > "$key"
          auth=(--key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID")
          ditto -c -k --keepParent target/Heft.app "$RUNNER_TEMP/notarize.zip"
          result=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${auth[@]}" --wait --timeout 1h --output-format json)
          echo "$result"
          if [ "$(jq -r .status <<< "$result")" != Accepted ]; then
            xcrun notarytool log "$(jq -r .id <<< "$result")" "${auth[@]}" || true
            echo "::error::Notarization failed"
            exit 1
          fi
          rm "$key"
          xcrun stapler staple target/Heft.app
          spctl --assess --type execute --verbose=2 target/Heft.app

      - name: Package
        run: |
          mkdir dist
          ditto -c -k --keepParent target/Heft.app "dist/heft-$VERSION-macos-universal.zip"

      - name: Homebrew cask
        run: bash scripts/homebrew-cask.sh "$VERSION" "dist/heft-$VERSION-macos-universal.zip" homebrew

      - name: Remove the signing keychain
        if: always() && vars.APPLE_TEAM_ID != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-cask
          path: homebrew/heft.rb

  linux:
    name: Linux
    needs: version
    # An older Ubuntu, so the binary also runs on distributions with an older
    # glibc (2.35 and later).
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release --locked

      - name: Smoke test
        run: |
          target/release/heft --bench . --out bench.txt
          cat bench.txt
          grep -q "^files" bench.txt

      - uses: actions/download-artifact@v8
        with:
          name: third-party-licenses

      # scripts/install-linux.sh uses the included binary instead of building.
      - name: Package
        run: |
          name=heft-$VERSION-linux-x86_64
          mkdir -p "$name/scripts" "$name/packaging/linux" dist
          cp target/release/heft LICENSE THIRD-PARTY-LICENSES.txt README.md "$name/"
          cp scripts/install-linux.sh "$name/scripts/"
          cp packaging/linux/heft.desktop "$name/packaging/linux/"
          tar -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: dist/*

  release:
    name: Draft release
    needs: [version, windows, macos, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      # Lets anyone check a download with `gh attestation verify`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOWS_SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
          MACOS_SIGNED: ${{ vars.APPLE_TEAM_ID != '' }}
        run: |
          windows="heft.exe is code-signed through [SignPath Foundation](https://signpath.org/)."
          macos="Heft.app is signed with a Developer ID and notarized by Apple."
          case "$WINDOWS_SIGNED/$MACOS_SIGNED" in
            true/true) signing="$windows $macos" ;;
            true/*) signing="$windows The macOS download isn't signed yet, so macOS warns the first time you open Heft." ;;
            */true) signing="$macos The Windows download isn't signed yet, so Windows warns the first time you open Heft." ;;
            *) signing="The downloads aren't code-signed yet, so Windows and macOS warn the first time you open Heft." ;;
          esac
          cat >> notes.md <<EOF

          ## Downloads

          | System | File |
          |---|---|
          | Windows 10 and 11 (x64) | \`heft-$VERSION-windows-x86_64.zip\` |
          | macOS 11 and later (Apple Silicon and Intel) | \`heft-$VERSION-macos-universal.zip\` |
          | Linux (x86_64) | \`heft-$VERSION-linux-x86_64.tar.gz\` |

          $signing The [install instructions](https://github.com/$GITHUB_REPOSITORY#install) explain how to open it anyway and how to check that a download was built from this repository.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Heft $VERSION" --notes-file notes.md
