[package]
name = "heft"
version = "1.0.1"
edition = "2024"
description = "Disk usage analyzer and cleanup tool with a treemap, duplicate finder and scan history"
license = "MIT"
readme = "README.md"
repository = "https://github.com/gjnail/heft"
keywords = ["disk-usage", "treemap", "cleaner", "duplicates", "windirstat"]
categories = ["filesystem", "gui", "command-line-utilities"]
exclude = ["docs/*.png"]

[dependencies]
crossbeam-channel = "0.5"
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence"] }
lz4_flex = "0.14"
png = "0.18"
rayon = "1"
rfd = "0.17"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[build-dependencies]
png = "0.18"
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_Security", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_DataExchange", "Win32_System_Environment", "Win32_System_Performance", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_Devices_DeviceAndDriverInstallation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Wdk_Graphics_Direct3D"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# macOS moves things to the Trash itself (see platform::move_to_trash).
[target.'cfg(not(target_os = "macos"))'.dependencies]
trash = "5"

# macOS integration: the Trash, the menu bar icon, notifications, and reading
# property lists (app bundles, launch agents). eframe already builds these.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSBitmapImageRep", "NSButton", "NSControl", "NSGraphics", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSError", "NSFileManager", "NSAppleEventManager", "NSBundle", "NSGeometry"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationTrigger", "UNUserNotificationCenter"] }
plist = { version = "1", default-features = false }
winit = { version = "0.30", default-features = false }

# Linux needs a windowing backend picked explicitly.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["x11", "wayland"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2
