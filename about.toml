# cargo-about settings for THIRD-PARTY-LICENSES.txt, which ships with every
# download. The release workflow runs:
#   cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt
# When a crate has a choice of licenses, the first one listed here is used.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "BSL-1.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true
